[package]
name = "wsight"
version = "0.5.2"
description = "WSight - lightweight desktop widgets: hardware monitor panel + QWeather panel"
authors = ["WSight"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# hardware sampling - pure syscalls, no PowerShell / no WMI polling
sysinfo = "0.33"

# NVIDIA GPU load / vram / temperature via NVML (graceful no-op on other GPUs)
nvml-wrapper = "0.10"

# QWeather REST client.
# `gzip` is REQUIRED: devapi.qweather.com always answers with
# `Content-Encoding: gzip` even when the client does not advertise it, so
# without the feature `.json()` chokes on raw compressed bytes with
# "error decoding response body".
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "macros",
  # `fs` and `io-util` are what the self-updater streams a download with
  # (`tokio::fs::File` + `AsyncWriteExt`). Tauri enables both transitively, so
  # they are already in the build - listed here because relying on another
  # crate's feature list is how a `tokio::fs` call starts failing to compile on
  # a dependency bump.
  "fs",
  "io-util",
] }

# Windows registry helpers for the auto-start `Run` key.
# `reg.exe` was simpler but is blocked by some sandbox/AV policies; using the
# Win32 API directly avoids spawning a child process and keeps quotes correct.
winreg = "0.52"

# SHA-256 for the self-updater: GitHub publishes a `digest` per release asset
# and a downloaded binary is not run until it matches.
sha2 = "0.10"

[features]
# The Tauri CLI turns this on for production builds. WITHOUT it `tauri-macros`
# compiles with `dev: true`, and every window is pointed at `build.devUrl`
# (http://localhost:1420) instead of the bundled assets -> the window shows
# "ERR_CONNECTION_REFUSED / localhost 拒绝连接".
# `cargo build --release` alone does NOT enable it - always build through
# `pnpm tauri build` (or pass `--features custom-protocol` manually).
# DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
